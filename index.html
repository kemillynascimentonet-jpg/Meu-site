<h2>Uma música para você 🎶</h2>

<audio id="minhaMusica" src='WhatsApp Audio 2026-10-21 at 19.23.04 (1).mpeg"></audio>

<button onclick="tocarMusica()" id="botaoMusica">
  🎵 Tocar música
</button>

<script>
  function tocarMusica() {
    const musica = document.getElementById("minhaMusica");
    const botao = document.getElementById("botaoMusica");

    if (musica.paused) {
      musica.play();
      botao.innerText = "⏸️ Pausar música";
    } else {
      musica.pause();
      botao.innerText = "🎵 Tocar música";
    }
  }
</script>
